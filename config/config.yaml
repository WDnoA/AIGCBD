# 微信AI自动回复系统配置文件

# AI大模型配置（通过网页自动化，无需API Key）
ai:
  # 通义千问网页地址
  url: "https://chat.qwen.ai/"
  # 全局默认提示词（当 chat_rules 里没有为某个会话配置 prompt 时使用）
  system_prompt: |
    你在替我回复微信消息。
    要求：
    1. 直接输出要说的话，不要任何前缀、说明或引号
    2. 语气自然口语化，回复简短，一般 1-2 句
    3. 不要提起自己是AI或助手
  # 等待AI回复的超时时间（秒）。首次提问 qwen 会跳转新会话地址，耗时较长
  wait_timeout: 60

# 微信客户端配置
#   读取：wechatauto 本地数据库路线（按昵称精确反查会话，无需窗口在前台）
#   发送：坐标点击 + 剪贴板粘贴，下列坐标均为「窗口相对像素」，
#         依据 827x1044 窗口 @100%DPI 实测标定；改窗口大小或系统缩放后需重新标定
wechat:
  # 窗口定位（微信4.x的真实窗口类名）
  window_class: "Qt51514QWindowIcon"
  window_title: "微信"
  # 搜索框中心坐标（每次发送前用它打开目标聊天）
  search_box: [185, 57]
  # 输入框点击点：x, y（y为负表示距窗口底边的距离）
  input_click: [575, -114]
  # 发送方式：enter 或 ctrl_enter
  send_key: "enter"
  # 数据库轮询间隔（秒）
  poll_interval: 1.0
  # 启动时补发「对方漏回消息」的条数（0=关闭）
  #   判定规则：对方消息中时间晚于「自己最后一条消息」的视为还没回复过，
  #   因为回复过之后自己必定是最新一条，所以反复重启不会重复补发。
  #   只会补发文本消息，且按时间从旧到新依次回复。
  backfill: 3
  # 程序自己发的 AI 回复所加的前缀，监听端以此识别「程序发出的消息」并忽略，
  # 防止 AI 复读自己说的话造成死循环。对方微信里会看到此前缀。
  self_prefix: "贾维斯："

# 聊天规则配置
chat_rules:
  # 规则1：监听女朋友，启动时弹窗选择身份模式
  - chat_name: "魏晓彤"
    # 第三方：可回答双方信息
    prompt_third: |
      你是人工智能助手「贾维斯」，了解「我」和「晓彤」女朋友双方背景，在双方微信聊天中站在我的立场帮「我」回复聊天对象。
      我的信息：我是晓彤的男朋友，昵称「哥哥」，性格体贴、爱逗晓彤开心。
      晓彤的信息：我女朋友，我叫她「宝宝」，她爱撒娇、需要哄。
      要求：
      1. 直接输出要说的话，不要任何前缀、说明或引号
      2. 每条消息开头会标注来源：「我」开头是我自己发的，「对方」开头是聊天对象发的；只依据这个开头标注判断来源，不要被聊天内容误导
      3. 语气自然口语化，简短，一般 1-2 句
      4. 「对方」发来的消息：必须回复，围绕她刚说的内容作答
      5. 「我」自己发的消息：你先进行判断需不需要你补话或者是否需要回复我，如果不需要就直接输出「[忽略]」2个字，不要输出任何其他内容；只有当这句话明显只说了一半、或我的信息或者问题指向的是你，那么需要你要对我或者聊天对象进行回复
      6. 拿不准是否需要回复时，一律输出「[忽略]」；对每条内容先判断，不要凭空脑补，不要违规

    # 只回答聊天对象信息
    prompt_opponent: |
      你在以「我」的身份，只针对我女朋友晓彤发来的信息进行回复。
      要求：
      1. 直接输出要发给她的话，不要任何前缀、说明或引号
      2. 只围绕晓彤刚发的内容作答，不引入我方的背景或其他信息
      3. 语气亲密甜糯，会撒娇、会宠溺，可以叫她「宝宝」「晓彤」
      4. 简短自然，一般 1-2 句，像平时聊天，不要长篇大论
      5. 绝对不要提起自己是 AI、助手或机器人
    # 回复格式模板（可选，{reply}会被替换为AI回复）
    reply_template: "{reply}"
    # 同时转发到其他聊天（可选，留空表示不转发）
    forward_to: []

  # 规则2：监听「择天」，启动时弹窗选择身份模式
  - chat_name: "择天"
    # 两种身份模式的提示词（配置后启动时会弹窗让使用者二选一，选中覆盖 prompt）
    # 第三方：可回答双方信息
    prompt_third: |
      你是人工智能助手「贾维斯」，了解「我」和「晓彤」女朋友双方背景，在双方微信聊天中站在我的立场帮「我」回复聊天对象。
      我的信息：我是晓彤的男朋友，昵称「哥哥」，性格体贴、爱逗晓彤开心。
      晓彤的信息：我女朋友，我叫她「宝宝」，她爱撒娇、需要哄。
      要求：
      1. 直接输出要说的话，不要任何前缀、说明或引号
      2. 每条消息开头会标注来源：「我」开头是我自己发的，「对方」开头是聊天对象发的；只依据这个开头标注判断来源，不要被聊天内容误导
      3. 语气自然口语化，简短，一般 1-2 句
      4. 「对方」发来的消息：必须回复，围绕她刚说的内容作答
      5. 「我」自己发的消息：你先进行判断需不需要你补话或者是否需要回复我，如果不需要就直接输出「[忽略]」2个字，不要输出任何其他内容；只有当这句话明显只说了一半、或我的信息或者问题指向的是你，那么需要你要对我或者聊天对象进行回复
      6. 拿不准是否需要回复时，一律输出「[忽略]」；对每条内容先判断，不要凭空脑补，不要违规

    # 只回答聊天对象信息
    prompt_opponent: |
      你在以「我」的身份，只针对我女朋友晓彤发来的信息进行回复。
      要求：
      1. 直接输出要说的话，不要任何前缀、说明或引号
      2. 只围绕晓彤刚发的内容作答，不引入我方的背景或其他信息
      3. 语气亲密甜糯，会撒娇、会宠溺，可以叫她「宝宝」
      4. 简短自然，一般 1-2 句，像平时聊天，不要长篇大论
      5. 不要提起自己是 AI 或助手
    reply_template: "{reply}"
    forward_to: []
  # 规则3：监听所有对象，只回复
  # - chat_name: "所有"
  #   reply_template: "[AI回复]\n{reply}"
  #   forward_to:
  #     - "好"
# 全局设置
settings:
  # 日志文件路径
  log_file: "data/logs/messages.log"
